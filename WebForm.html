}
function syncReceive(){
  var qty=Number($('cQty').value),valid=Number.isInteger(qty)&&qty>0&&qty<=ORD.outstanding;
  $('cGo').disabled=S.busy||!valid;$('cGo').textContent=valid?'Receive '+qty:'Receive quantity';
  $('receivePreview').textContent=valid?(ORD.received+qty)+' of '+ORD.ordered+' received · '+(ORD.outstanding-qty)+' still due'+(qty===ORD.outstanding?' · order complete':'')
    :!$('cQty').value?'Enter the quantity that arrived.':'Enter a whole quantity from 1 to '+ORD.outstanding+'.';
}

function submitReceive(){
  syncReceive();if(S.busy||$('cGo').disabled)return;S.busy=true;clearSheetError();$('cGo').disabled=true;$('cGo').textContent='Saving…';
  var qty=Number($('cQty').value),order=ORD;
  call('receiveOrder',[{reorderId:order.id,qtyReceived:qty,notes:$('cNote').value}]).then(function(r){
    S.busy=false;S.receipt={message:'Received '+qty+' × '+order.itemName+' · '+r.received+' of '+r.ordered+' received · '+(r.ordered-r.received)+' still due'+(r.status==='Received'?' · order complete':''),receiving:true};
    closeSheet();patchItem(r.item);reload();
  }).catch(function(e){S.busy=false;syncReceive();fail(e)});
}

/* ============================================================
   Usage
   ============================================================ */
function renderUsage(){
  var epoch=S.epoch,view=++S.viewSeq;
  $('view').innerHTML='<div class="skel"></div><div class="skel"></div>';
  call('getUsageStats',[S.dept]).then(function(u){
    if(epoch!==S.epoch||view!==S.viewSeq||S.tab!=='usage')return;
    var h='<div class="note">Rates come from the last '+u.windowDays+' days, measured over the '
      +'time each item was actually in stock — not the whole period. An item that ran out '
      +'was not being used slowly, it was unavailable. A second '+u.recentDays+'-day window '
      +'runs alongside, only to say whether things are picking up or slowing down.</div>';

    if(u.truncated){
      h+='<div class="note" style="border-left-color:var(--low)">The log is longer than the report '
        +'reads, so older movements are not counted. Raise the log scan size in Settings.</div>';
    }

    /* Put this first when it happens. More returned than taken is impossible over
       a long enough window, so it means a return was logged against the wrong
       item or with a mistyped quantity — and because the net figure clamps at
       zero, the effect is that the item silently reports "nothing used yet" and
       vanishes from the forecast. One fat finger used to take out the headline
       number with no visible cause. */
    if(u.dataQuality.length){
      h+='<div class="section-heading"><span>Check these — more came back than went out</span></div>'
        +'<div class="note" style="border-left-color:var(--out)">Returns may belong to issues before this reporting window. '
        +'Review the movements before deciding whether anything needs correcting.</div>'
        +u.dataQuality.map(function(r){
          return '<div class="row" style="padding:10px 12px"><div class="hd">'
            +'<div class="nm">'+'<button class="context-link" onclick="openItem(\''+r.id+'\')">'+esc(r.name)+'</button></div>'
            +'<div class="tag">'+r.taken+' out / '+r.returned+' back</div></div></div>';
        }).join('');
    }

    if(u.running.length){
      h+='<div class="section-heading"><span>Running out soonest</span></div>';
      h+=u.running.slice(0,12).map(coverRow).join('');
    }

    if(u.overdueOrders.length){
      h+='<div class="section-heading"><span>Ordered but overdue</span></div>'
        +'<div class="note">Cover above counts these as stock on the way.</div>'
        +u.overdueOrders.map(function(r){
          return '<div class="row" style="padding:10px 12px"><div class="hd">'
            +'<div><div class="nm">'+'<button class="context-link" onclick="openItem(\''+r.id+'\')">'+esc(r.name)+'</button></div>'
            +'<div class="tag sub">'+r.onOrder+' outstanding'
            +(r.onOrderDue?' · was due '+esc(r.onOrderDue):'')+'</div></div>'
            +'<span class="pill late">'+r.onOrderOverdue+'d late</span></div></div>';
        }).join('');
    }

    if(u.thresholdAdvice.length){
      h+='<div class="section-heading"><span>Minimums that will not survive a delivery</span></div>'
        +'<div class="note">At this rate, these run out before a replacement order could arrive. '
        +'Nothing is changed automatically — raise the minimum on the item if you agree.</div>';
      h+=u.thresholdAdvice.map(function(r){
        return '<div class="row" style="padding:10px 12px"><div class="hd">'
          +'<div><div class="nm">'+'<button class="context-link" onclick="openItem(\''+r.id+'\')">'+esc(r.name)+'</button></div>'
          +'<div class="tag sub">set to '+r.min+' · '+r.perWeek+' a week · '
          +r.leadTimeDays+' day delivery</div></div>'
          +'<div style="text-align:right"><div class="num" style="font-size:1.25rem;font-weight:600;color:var(--low)">'
          +r.suggestedMin+'</div><div class="tag">suggested</div></div></div>'
          +'<div class="why">'+esc(r.leadTimeSource)
          +(r.leadTimeWorst>r.leadTimeDays?' · worst seen '+r.leadTimeWorst+' days':'')
          +'</div></div>';
      }).join('');
    }

    if(u.movers.length){
      h+='<div class="section-heading"><span>Moving fastest</span></div>';
      h+=u.movers.map(function(r){
        return '<div class="row" style="padding:10px 12px"><div class="hd">'
          +'<div class="nm">'+'<button class="context-link" onclick="openItem(\''+r.id+'\')">'+esc(r.name)+'</button></div>'
          +'<div><span class="num" style="font-weight:600">'+r.grossPerWeek+'</span> '
          +'<span class="tag">/week</span></div></div>'
          +(r.returned?'<div class="why">'+r.taken+' out, '+r.returned+' back — '
            +(r.perWeek===null?'net rate unavailable':r.perWeek+'/week net used')+'</div>':'')
          +(r.trend&&r.trend!=='steady'
            ? '<div class="why'+(r.trend==='picking up'?' warn':'')+'">'
              +esc(r.trend)+' — '+r.recentPerWeek+'/week over the last '+u.recentDays+' days</div>'
            : '')
        +'</div>';
      }).join('');
    }

    /* Not a failure state. Most of a stockroom is slow movers, and the honest
       answer for a projector lamp taken twice a year is an annual count, not a
       daily rate withheld as unreliable. 3.1 showed these as blanks. */
    if(u.unknown.length){
      h+='<div class="section-heading"><span>No useful rate yet</span></div>'
        +'<div class="note">A rate needs '+u.minEvents+' movements to mean anything. These move too '
        +'rarely for that, so here is the count instead — which is the number you would actually '
        +'plan a yearly order from.</div>';
      h+=u.unknown.map(function(r){
        return '<div class="row" style="padding:10px 12px"><div class="hd">'
          +'<div class="nm">'+'<button class="context-link" onclick="openItem(\''+r.id+'\')">'+esc(r.name)+'</button></div>'
          +'<div class="tag">'+r.shelf+' on shelf</div></div>'
          +'<div class="why">'+esc(r.withheld)+'</div></div>';
      }).join('');
    }

    if(u.topDestinations.length){
      h+='<div class="section-heading"><span>Where it went</span></div>';
      var max=u.topDestinations[0].units;
      h+=u.topDestinations.map(function(d){
        var pct=Math.round(d.units/max*100);
        return '<div class="row" style="padding:10px 12px">'
          +'<div class="hd"><div class="nm">'+esc(d.destination)+'</div>'
          +'<div class="num" style="font-weight:600">'+d.units+'</div></div>'
          +'<div class="meter bar" style="margin-top:8px">'
          +'<i style="flex:'+pct+'"></i><i class="e" style="flex:'+(100-pct)+'"></i></div></div>';
      }).join('');
    }

    if(!u.running.length && !u.movers.length && !u.unknown.length){
      h='<div class="empty"><div class="big">Nothing to measure yet</div>'
        +'<p>Usage rates need a few movements per item. Keep logging pulls and this fills in '
        +'over the first couple of weeks.</p></div>';
    }
    $('view').innerHTML=h;
  }).catch(function(){if(epoch===S.epoch&&view===S.viewSeq&&S.tab==='usage')$('view').innerHTML=loadError('Could not load usage.','renderUsage()')});
}

/* One forecast row. The number is always shown with what it was worked out
   from, because a rate from three movements and a rate from three hundred look
   identical otherwise — and the whole point of this screen is that people can
   tell the difference. */
/**
 * One forecast row.
 *
 * Rows without a measurable rate appear here too, which is new: an empty shelf
 * is a fact and does not need three movements to qualify as urgent. 3.1 required
 * `reliable`, so the item that had just run out with two movements behind it was
 * missing from the one list that was supposed to warn you about it.
 */
function coverRow(r){
  var headline, tone;
  if(r.state==='out'){ headline='empty'; tone='var(--out)' }
  else if(r.cover){ headline=r.cover; tone=(r.daysLeft<=14?'var(--out)':'var(--low)') }
  else { headline='at or below minimum'; tone='var(--low)' }

  var h='<div class="row" style="padding:10px 12px"><div class="hd">'
    +'<div><div class="nm">'+esc(r.name)+'</div>'
    +'<div class="tag sub">'+r.shelf+' left'+(r.perWeek?' · '+r.perWeek+' a week':'')
    +(r.min?' · minimum '+r.min:'')+'</div></div>'
    +'<div style="text-align:right;flex-shrink:0"><div style="font-weight:600;font-size:.98rem;color:'
    +tone+'">'+esc(headline)+'</div>'
    +'<div class="tag">'+(r.cover?'of cover':'on the shelf')+'</div></div></div>';

  if(r.onOrder){
    h+='<div class="why'+(r.onOrderOverdue?' warn':'')+'">'+r.onOrder+' on order'
      +(r.onOrderDue?', due '+esc(r.onOrderDue):'')
      +(r.onOrderOverdue?' — '+r.onOrderOverdue+' days late, chase it'
                        :(r.coverWithOrder?' — '+esc(r.coverWithOrder)+' once they land':''))
      +'</div>';
  }
  if(r.ranOut){
    h+='<div class="why warn">Ran out during this period, so the real rate may be higher</div>';
  }
  if(r.trend&&r.trend!=='steady'){
    h+='<div class="why'+(r.trend==='picking up'?' warn':'')+'">'+esc(r.trend)+'</div>';
  }
  h+='<div class="why">'
    +(r.reliable ? r.events+' movements over '+r.observedDays+' days in stock'
                 : esc(r.withheld||'no measurable rate yet'))
    +'</div>';
  return h+'</div>';
}

/* ============================================================
   Log — what has actually been happening
   ============================================================ */
/**
 * The activity view.
 *
 * getTransactions() and the "how many rows of history should the app show?"
 * setting both shipped a version ago with nothing calling them, so the only way
 * to see what had just happened — or to find a mistake worth reversing — was to
 * open the spreadsheet. Which nobody standing at a shelf can do.
 *
 * Reversal lives here as well as on the toast, because the toast only covers the
 * seconds after the event. The server decides what each person may reverse and
 * ships that as `canReverse` per row, so this screen never has to reimplement
 * the rule and get it subtly different.
 */
function renderLog(){
  var epoch=S.epoch,view=++S.viewSeq;
  if(S.activity){ paintLog(); return }
  $('view').innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  call('getTransactions',[S.dept,60,'']).then(function(rows){
    if(epoch!==S.epoch||view!==S.viewSeq||S.tab!=='log')return;
    S.activity=rows; paintLog();
  }).catch(function(){if(epoch===S.epoch&&view===S.viewSeq&&S.tab==='log')$('view').innerHTML=loadError('Could not load recent activity.','renderLog()')});
}

function paintLog(){
  var rows=S.activity;
  if(!rows.length){
    $('view').innerHTML='<div class="empty"><div class="big">Nothing logged yet</div>'
      +'<p>Every take, return, disposal and delivery lands here.</p></div>';
    return;
  }

  var day='';
  var h='<div class="note">Newest first. Anything you can still reverse has an Undo next to it.</div>';
  rows.forEach(function(t){
    var d=String(t.timestamp).slice(0,10);
    if(d!==day){ day=d; h+='<div class="section-heading"><span>'+esc(d)+'</span></div>' }

    h+='<div class="row" style="padding:10px 12px">'
      +'<div class="hd"><div style="min-width:0">'
      +'<div class="nm">'+esc(t.action)+' '+t.quantity+' × '+esc(t.itemName)+'</div>'
      +'<div class="tag sub">'+esc(String(t.timestamp).slice(11,16))+' · '+esc(t.userName)
      +(t.mine?' (you)':'')+(t.destination?' · '+esc(t.destination):'')+'</div></div>'
      +(t.voided?'<span class="pill void">reversed</span>':'')
      +'</div>'
      +(t.notes?'<div class="why">'+esc(t.notes)+'</div>':'')
      +(t.voided&&t.voidNote?'<div class="why">'+esc(t.voidNote)+'</div>':'');

    if(t.canReverse){
      h+='<div class="acts"><button class="btn sm sec" onclick="openReverse(\''+t.id+'\')">'
        +'Reverse this</button></div>';
    }
    h+='</div>';
  });
  $('view').innerHTML=h;
}

function openReverse(txnId){
  var t=null; (S.activity||[]).forEach(function(x){if(x.id===txnId)t=x});
  if(!t)return;
  reasonSheet({
    title:'Reverse this movement',
    subtitle:t.action+' '+t.quantity+' × '+t.itemName+' · '+t.timestamp,
    note:'The original row stays in the log, marked as reversed. The stock count moves back.',
    label:'Why is it being reversed', placeholder:'e.g. logged against the wrong item',
    confirm:'Reverse it',
    go:function(why){
      return call('voidTransaction',[txnId,why]).then(function(){
        toast('Reversed'); closeSheet(); S.activity=null;
        return reload().then(function(){ if(S.tab==='log') renderLog() });
      });
    }
  });
}

/* ============================================================
   Add / edit item
   ============================================================ */
function openAdd(){itemForm(null)}
function openEdit(){itemForm(CUR.item)}

function itemForm(item){
  var L=S.boot.lists;
  var isNew=!item;
  var v=function(x){return esc(item?item[x]:'')};

  var h='<div class="grip"></div><h2>'+(isNew?'Add an item':'Edit item')+'</h2>'
    +(isNew?'':'<span class="tag">'+esc(item.id)+'</span>')
    +'<div class="perf"></div>'
    +'<div class="f"><label class="tag">Name</label><input id="iName" value="'+v('name')+'" placeholder="e.g. APC RBC17 Battery"></div>'
    +'<div class="f2">'
      +'<div class="f"><label class="tag">Category</label><input id="iCat" list="catList" value="'+v('category')+'">'
      +'<datalist id="catList">'+(L.categories||[]).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'
      +'<div class="f"><label class="tag">Shelf location</label><input id="iLoc" list="locList" value="'+v('location')+'">'
      +'<datalist id="locList">'+(L.locations||[]).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'
    +'</div>';

  if(isNew){
    h+='<div class="f2">'
      +'<div class="f"><label class="tag">Department</label><select id="iDept">'
      +S.boot.departments.map(function(d){
        return '<option value="'+d.id+'"'+(d.id===S.dept?' selected':'')+'>'+esc(d.label)+'</option>';
      }).join('')+'</select></div>'
      +'<div class="f"><label class="tag">Starting count</label><input id="iQty" class="num" type="number" min="0" value="0"></div>'
    +'</div>';
  }

  /* This one field decides how the item behaves when it comes back, so it is
     worth more than a dropdown with two words in it.

     Built from the class table the server shipped, not from two hardcoded
     options — so adding a class to CONFIG.ITEM_CLASSES makes it appear here with
     its own label and explanation. */
  var classes=S.boot.itemClasses||[];
  var cls=item?item.itemClass:(classes[0]&&classes[0].key)||'consumable';
  h+='<div class="f"><label class="tag">What happens when it comes back</label>'
    +'<div class="picker"><select id="iClass" onchange="showClassBlurb()">'
    +classes.map(function(c){
      return '<option value="'+esc(c.key)+'"'+(cls===c.key?' selected':'')+'>'+esc(c.label)+'</option>';
    }).join('')
    +'</select></div>'
    +'<div class="cfg-help" id="classBlurb"></div></div>';

  h+='<div class="f2">'
    +'<div class="f"><label class="tag">Reorder at</label><input id="iMin" class="num" type="number" min="0" value="'+(item?item.min:2)+'"></div>'
    +'<div class="f"><label class="tag">Top up to</label><input id="iTo" class="num" type="number" min="0" value="'+(item?item.reorderTo:10)+'"></div>'
  +'</div>'
  +'<div class="f2">'
    +'<div class="f"><label class="tag">Vendor</label><input id="iVendor" list="vendList" value="'+v('vendor')+'">'
    +'<datalist id="vendList">'+(L.vendors||[]).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'
    +'<div class="f"><label class="tag">Unit cost</label><input id="iCost" class="num" type="number" step="0.01" value="'+v('unitCost')+'"></div>'
  +'</div>'
  +'<div class="f"><label class="tag">Notes</label><textarea id="iNotes">'+v('notes')+'</textarea></div>';

  h+='<div class="f"><label class="tag">Photo</label>';
  if(S.boot.photoUploadEnabled){
    h+='<input id="iPhoto" type="file" accept="image/*" capture="environment" onchange="uploadPhoto(this)">'
      +'<div id="photoState" class="tag" style="margin-top:6px">'
      +(item&&item.imageUrl?'Photo attached':'Take one now or leave blank')+'</div>';
  } else {
    h+='<input id="iUrl" value="'+v('imageUrl')+'" placeholder="https://… image link">'
      +'<div class="tag" style="margin-top:6px">Direct upload is off. An admin can turn it on in Config.gs.</div>';
  }
  h+='</div>'
  +'<input type="hidden" id="iImage" value="'+v('imageUrl')+'">';

  h+='<div class="btn-row"><button class="btn sec" onclick="closeSheet()">Cancel</button>'
    +'<button class="btn" id="iGo" onclick="'+(isNew?'submitNew()':'submitEdit(\''+item.id+'\')')+'">'
    +(isNew?'Add item':'Save changes')+'</button></div>';

  if(!isNew && has('item.adjust')){
    h+='<div class="hr"></div>'
      +'<div class="f"><label class="tag">Correct the shelf count</label>'
      +'<div class="f2"><input id="aQty" class="num" type="number" min="0" value="'+item.shelf+'">'
      +'<input id="aWhy" placeholder="Reason (required)"></div>'
      +'<button class="btn sec wide sm" style="margin-top:8px" onclick="submitAdjust(\''+item.id+'\')">Save correction</button></div>';
  }

  /* Retiring an item existed server-side with no button, so a discontinued line
     stayed on every shelf list forever. The server refuses while units are on the
     bench or an order is open, and keeps the row for its history. */
  if(!isNew && has('item.archive')){
    h+='<div class="hr"></div>'
      +'<button class="btn sec wide sm" onclick="confirmArchive(\''+item.id+'\')">'
      +'Retire this item</button>'
      +'<div class="cfg-help" style="margin-top:6px">Takes it off the stock list and keeps every '
      +'movement it ever had. Not allowed while units are on the bench or an order is open.</div>';
  }

  $('sheet').innerHTML=h;
  mountPanel();
  showClassBlurb();
}

/* The explanation under the class picker, from the same table that supplies the
   options — so it can never describe a different class than the one selected. */
function showClassBlurb(){
  var sel=$('iClass'), box=$('classBlurb');
  if(!sel||!box) return;
  var blurb='';
  (S.boot.itemClasses||[]).forEach(function(c){ if(c.key===sel.value) blurb=c.blurb });
  box.textContent=blurb;
}

function confirmArchive(id){
  var name=id;
  S.boot.items.forEach(function(i){ if(i.id===id) name=i.name });
  reasonSheet({
    title:'Retire this item', subtitle:name,
    note:'It disappears from the stock list. Every movement it ever had stays in the log, and you '
      +'can put it back by setting Active to Yes on the Inventory tab.',
    label:'Why is it being retired', placeholder:'e.g. discontinued, replaced by the 1.5m version',
    confirm:'Retire it',
    go:function(why){
      return call('archiveItem',[id,why]).then(function(){
        toast('Retired'); closeSheet(); return reload();
      });
    }
  });
}

function uploadPhoto(input){
  var file=input.files&&input.files[0]; if(!file)return;
  $('photoState').textContent='Uploading…';
  var reader=new FileReader();
  reader.onload=function(){
    call('uploadPhoto',[{
      data:reader.result.split(',')[1], mimeType:file.type, filename:file.name
    }]).then(function(r){
      $('iImage').value=r.url;
      $('photoState').textContent='Photo attached';
    }).catch(function(e){$('photoState').textContent=e.message});
  };
  reader.readAsDataURL(file);
}

function submitNew(){
  if(S.busy)return; S.busy=true;
  clearSheetError();
  $('iGo').disabled=true; $('iGo').textContent='Saving…';
  call('createItem',[{
    name:$('iName').value, category:$('iCat').value, department:$('iDept').value,
    location:$('iLoc').value, shelf:$('iQty').value, min:$('iMin').value,
    itemClass:$('iClass').value,
    reorderTo:$('iTo').value, vendor:$('iVendor').value, unitCost:$('iCost').value,
    notes:$('iNotes').value, imageUrl:$('iImage').value||($('iUrl')?$('iUrl').value:'')
  }]).then(function(){
    S.busy=false;toast('Item added');closeSheet();return reload();
  }).catch(function(e){
    S.busy=false; fail(e); $('iGo').disabled=false; $('iGo').textContent='Add item';
  });
}

function submitEdit(id){
  if(S.busy)return; S.busy=true;
  clearSheetError();
  $('iGo').disabled=true; $('iGo').textContent='Saving…';
  call('updateItem',[id,{
    'Item Name':$('iName').value, 'Category':$('iCat').value, 'Location':$('iLoc').value,
    'Item Class':$('iClass').value,
    'Min Threshold':$('iMin').value, 'Reorder To':$('iTo').value,
    'Vendor':$('iVendor').value, 'Unit Cost':$('iCost').value, 'Notes':$('iNotes').value,
    'Image URL':$('iImage').value||($('iUrl')?$('iUrl').value:'')
  }]).then(function(item){
    S.busy=false; toast('Saved'); closeSheet(); patchItem(item); return reload();
  }).catch(function(e){
    S.busy=false; fail(e); $('iGo').disabled=false; $('iGo').textContent='Save changes';
  });
}

function submitAdjust(id){
  clearSheetError();
  call('adjustStock',[id,$('aQty').value,$('aWhy').value]).then(function(item){
    toast('Count corrected'); closeSheet(); patchItem(item); return reload();
  }).catch(fail);
}

    +'</div>';

  if(has('settings.manage')){
    h+='<div class="hr"></div><button class="btn sec wide" onclick="openSettings()">Notification settings</button>';
    h+='<button class="btn sec wide" style="margin-top:8px" onclick="openUsers()">Manage people</button>';
  }
  h+='<div class="btn-row"><button class="btn sec" onclick="closeSheet()">Close</button></div>';
  h+='<div class="hr"></div><div class="f"><label for="startView">Open this view next time</label><select id="startView" onchange="try{localStorage.setItem(START_KEY,this.value)}catch(e){}"><option value="stock"'+(S.tab==='stock'?' selected':'')+'>Stock</option><option value="orders"'+(S.tab==='orders'?' selected':'')+'>Orders</option></select></div>';
  $('sheet').innerHTML=h;
  mountPanel();
}

function openSettings(){
  Promise.all([call('getSettings',[]), call('getConfigForApp',[])]).then(function(res){
    var s=res[0], schema=res[1];

    var h='<div class="grip"></div><h2>Settings</h2>'
      +'<span class="tag">Same values as the Config tab on the spreadsheet</span>'
      +'<div class="perf"></div>'
      +'<div class="tag" style="margin-bottom:10px">CHAT ALERTS</div>';

    s.webhooks.forEach(function(w){
      h+='<div class="f"><label class="tag">'+esc(w.label)+' space</label>'
        +'<input id="wh_'+w.id+'" placeholder="'
        +(w.configured?'Configured — leave blank to keep':'Paste the Google Chat webhook URL')+'">'
        +'<div class="tag" style="margin-top:5px">'
        +(w.configured
          ? esc(w.preview)+' &nbsp;<button class="btn sm sec" style="padding:2px 8px" onclick="testHook(\''+w.id+'\')">Send test</button>'
          : 'Not set up yet')
        +'</div></div>';
    });
    h+='<button class="btn sec wide sm" onclick="saveWebhooks()">Save webhooks</button>'
      +'<div class="note">Webhook URLs are credentials, so they are stored server-side and never '
      +'shown in full — and never written into the spreadsheet.</div>';

    var group='';
    schema.forEach(function(f){
      if(f.group!==group){
        h+='<div class="perf"></div><div class="tag" style="margin-bottom:10px">'
          +esc(f.group.toUpperCase())+'</div>';
        group=f.group;
      }
      h+='<div class="cfg"><div class="cfg-q">'+esc(f.label)+'</div>';
      if(f.type==='boolean'){
        h+='<select onchange="setCfg(\''+f.key+'\',this.value,this)">'
          +'<option value="Yes"'+(f.value?' selected':'')+'>Yes</option>'
          +'<option value="No"'+(f.value?'':' selected')+'>No</option></select>';
      } else if(f.options){
        h+='<select onchange="setCfg(\''+f.key+'\',this.value,this)">'
          +f.options.map(function(o){
            return '<option'+(String(o)===String(f.value)?' selected':'')+'>'+esc(o)+'</option>';
          }).join('')+'</select>';
      } else {
        h+='<input type="'+(f.type==='number'?'number':'text')+'" value="'+esc(f.value)
          +'" onchange="setCfg(\''+f.key+'\',this.value,this)">';
      }
      h+='<div class="cfg-help">'+esc(f.help)+'</div></div>';
    });

    h+='<div class="btn-row"><button class="btn sec" onclick="closeSheet()">Close</button></div>';
    $('sheet').innerHTML=h;
  }).catch(fail);
}

function setCfg(key, value, el){
  el.disabled=true;
  call('updateSetting',[key,value]).then(function(){
    el.disabled=false; toast('Saved');
    if(key==='app.orgName'||key==='app.defaultDepartment') reload();
  }).catch(function(e){el.disabled=false;fail(e)});
}

function saveWebhooks(){
  var hooks={};
  S.boot.departments.forEach(function(d){
    var el=$('wh_'+d.id); if(el && el.value.trim()) hooks[d.id]=el.value.trim();
  });
  if(!Object.keys(hooks).length){toast('Nothing to save');return}
  call('saveSettings',[{webhooks:hooks}])
    .then(function(){toast('Webhooks saved');openSettings()}).catch(fail);
}

function testHook(id){
  call('testWebhook',[id]).then(function(){toast('Test message sent')}).catch(fail);
}

function openUsers(){
  call('listUsers',[]).then(function(list){
    /* From the Roles tab, not a hardcoded list. Roles.gs has always supported
       adding a role by adding a column; this screen used to hardcode five names,
       so a new role was invisible in the only place you could assign it. */
    var roles=S.boot.roles||['viewer','staff','tech','manager','admin'];
    var h='<div class="grip"></div><h2>People</h2>'
      +'<span class="tag">'+list.length+' with access</span><div class="perf"></div>';

    h+=list.map(function(u){
      return '<div class="row" style="padding:10px 12px"><div class="hd">'
        +'<div style="min-width:0"><div class="nm">'+esc(u.name)+'</div>'
        +'<div class="tag sub" style="overflow:hidden;text-overflow:ellipsis">'+esc(u.email)+'</div></div>'
        +'<select onchange="changeRole(\''+esc(u.email)+'\',this.value)" style="padding:5px;border:1.5px solid var(--rule);border-radius:6px">'
        +roles.map(function(r){return '<option'+(r===u.role?' selected':'')+'>'+r+'</option>'}).join('')
        +'</select></div></div>';
    }).join('');

    h+='<div class="hr"></div><div class="tag" style="margin-bottom:8px">Add someone</div>'
      +'<div class="f"><input id="nuEmail" placeholder="name@yourcollege.edu"></div>'
      +'<div class="f2"><div class="f"><input id="nuName" placeholder="Display name"></div>'
      +'<div class="f"><select id="nuRole">'+roles.map(function(r){
        return '<option'+(r===S.boot.startingRole?' selected':'')+'>'+r+'</option>'}).join('')+'</select></div></div>'
      +'<button class="btn wide sm" onclick="addUser()">Add person</button>'
      +'<div class="note">People on your domain are added automatically as <b>'
      +esc(S.boot.startingRole)+'</b> the first time they open the app, which lets them look '
      +'but not change anything. Promote the ones who need more.</div>'
      +'<div class="btn-row"><button class="btn sec" onclick="closeSheet()">Close</button></div>';
    $('sheet').innerHTML=h;
  }).catch(fail);
}

function changeRole(email, role){
  call('setUserRole',[email,role,true]).then(function(){toast('Role updated')}).catch(fail);
}
function addUser(){
  call('inviteUser',[$('nuEmail').value,$('nuName').value,$('nuRole').value,S.dept])
    .then(function(){toast('Added');openUsers()}).catch(fail);
}

/* ============================================================
   Sheet plumbing
   ============================================================ */
function closeSheet(e){
  if(S.busy || (e&&e.target!==e.currentTarget))return;
  S.panelSeq++; clearSheetError(); $('veil').classList.remove('open'); document.body.classList.remove('detail-open');
  if(panelFocus&&document.contains(panelFocus))panelFocus.focus();
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeSheet();
  if(e.key==='Tab'&&$('veil').classList.contains('open')){
    var f=Array.from($('sheet').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea,a[href],summary')).filter(function(x){return x.getClientRects().length});
    var first=f[0],last=f[f.length-1];
    if(!f.length){e.preventDefault();return}
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('sheet'))){last.focus();e.preventDefault()}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}
  }
});
</script>
</body>
</html>
